<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Knowledge Base - URL Discovery</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container-simple">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-bracket">[</span>
                <span class="logo-text">URL_DISCOVERY</span>
                <span class="logo-bracket">]</span>
            </div>
            <div class="tagline">/// For NotebookLM Research v2.0</div>
        </header>

        <!-- Main Content -->
        <div class="main-content-simple">
            <!-- Input Section -->
            <section class="input-section">
                <h2 class="section-title">&gt; CONFIGURATION</h2>

                <div class="form-group">
                    <label for="company">COMPANY_NAME:</label>
                    <input type="text" id="company" placeholder="e.g., OpenAI" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="person">PERSON_NAME (optional):</label>
                    <input type="text" id="person" placeholder="e.g., Sam Altman" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="max-urls">MAX_URLS:</label>
                    <input type="number" id="max-urls" value="100" min="10" max="200">
                    <span class="hint">Recommended: 100 for comprehensive discovery</span>
                </div>

                <button id="discover-btn" class="btn-primary">
                    <span class="btn-icon">🔍</span> DISCOVER_URLS
                </button>

                <div id="status" class="status-message"></div>
            </section>

            <!-- Results Section -->
            <section class="results-section">
                <div class="results-header">
                    <h2 class="section-title">&gt; DISCOVERED_URLS</h2>
                    <div class="results-actions">
                        <button id="copy-all-btn" class="btn-secondary" disabled>COPY_ALL</button>
                        <button id="clear-btn" class="btn-secondary" disabled>CLEAR</button>
                    </div>
                </div>

                <!-- Stats -->
                <div id="stats" class="stats-panel" style="display: none;"></div>

                <!-- URL Textbox -->
                <div class="url-container">
                    <div class="url-label">All URLs (one per line - ready for NotebookLM):</div>
                    <textarea id="url-textbox" class="url-textbox" readonly placeholder="URLs will appear here..."></textarea>
                </div>

                <!-- Category Breakdown -->
                <div id="categories" class="categories-container"></div>
            </section>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
